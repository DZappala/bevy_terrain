[package]
name = "bevy_terrain"
description = "Terrain Rendering for the Bevy Engine."
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"
edition = "2024"
categories = ["game-engines", "rendering", "graphics"]
keywords = ["gamedev", "graphics", "bevy", "terrain"]
exclude = ["assets/*"]
readme = "README.md"
authors = ["Kurt Kühnert <kurt@kuehnert.dev>"]
repository = "https://github.com/kurtkuehnert/bevy_terrain"

[workspace]
members = ["preprocess"]

[features]
### Enable big space's, high-precision grid
high_precision = ["dep:big_space"]
### ???
rand = ["dep:rand"]
### Enable the Metal rendering API
metal_capture = ["dep:metal", "dep:wgpu-core"]
### Enable experimental wesl shaders in this repo and in bevy
wesl = ["bevy/shader_format_wesl"]
### Embed big space into the terrain plugin
embeded = ["high_precision", "rand"]
### Enable unstable features
alpha = ["wesl", "high_precision", "rand"]
### Enable mostly-stable features
beta = ["high_precision", "rand"]
### Enable mostly-stable features and embed big_space into the Terrain plugin
beta_dev = ["embeded"]


[dependencies]
tiff = "0.9.1"
bytemuck = "1.22"
bitflags = "2.9.0"
anyhow = "1.0.97"
serde = "1.0.219"
async-channel = "2.3.1"
bevy = "0.16.0"
bevy_common_assets = { git = "https://github.com/kurtkuehnert/bevy_common_assets", branch = "bevy-0.16", features = [
  "ron",
] }
ndarray = "0.16.1"
itertools = "0.14.0"
derive_more = { version = "2.0.1", features = ["from"] }
slab = "0.4.9"
strum = "0.27.1"
strum_macros = "0.27.1"
big_space = { git = "https://github.com/aevyrie/big_space", rev = "3b254a829c17d198c067f4ec3e11d24a68211e1c", features = [
  "i32",
], optional = true }
rand = { version = "0.9.0", optional = true }
metal = { version = "0.31.0", optional = true }
wgpu-core = { version = "24.0.2", optional = true }

[[example]]
name = "spherical"
path = "examples/spherical.rs"
required-features = ["high_precision"]

[[example]]
name = "precision_demo"
path = "examples/precision_demo.rs"
required-features = ["high_precision", "rand"]
