[package]
name = "bevy_terrain"
description = "Terrain Rendering for the Bevy Engine."
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"
edition = "2024"
categories = ["game-engines", "rendering", "graphics"]
keywords = ["gamedev", "graphics", "bevy", "terrain"]
exclude = ["assets/*"]
readme = "README.md"
authors = ["Kurt Kühnert <kurt@kuehnert.dev>"]
repository = "https://github.com/kurtkuehnert/bevy_terrain"

[workspace]
members = ["preprocess"]

[features]
default = ["high_precision", "rand"]
high_precision = ["dep:big_space"]
rand = ["dep:rand"]
metal_capture = ["dep:metal", "dep:wgpu-core"]
unstable = ["wesl"]
wesl = ["bevy/shader_format_wesl"]

[dependencies]
tiff = "0.*"
bytemuck = "1.*"
bitflags = "2.*"
anyhow = "1.*"
serde = "1.*"
async-channel = "2.*"
bevy = "0.*"
bevy_common_assets = { git = "https://github.com/kurtkuehnert/bevy_common_assets", branch = "bevy-0.16", features = [
  "ron",
] }
ndarray = "0.*"
itertools = "0.*"
derive_more = { version = "2.*", features = ["from"] }
slab = "0.*"
strum = "0.*"
strum_macros = "0.*"
big_space = { version = "*", features = ["i32"], optional = true }
rand = { version = "0.*", optional = true }
metal = { version = "0.*", optional = true }
wgpu-core = { version = "*", optional = true }

[[example]]
name = "spherical"
path = "examples/spherical.rs"
required-features = ["high_precision"]

[[example]]
name = "precision_demo"
path = "examples/precision_demo.rs"
required-features = ["high_precision", "rand"]
